id: software
name: Updates and applications
component: software
evidence:
  - {id: update_ok, event_id: 19, provider_contains: WindowsUpdateClient}
  - {id: update_failed, event_id: 20, provider_contains: WindowsUpdateClient}
  - {id: app_crash, event_id: 1000, provider_contains: Application Error, log: Application}
  - {id: app_hang, event_id: 1002, provider_contains: Application Hang, log: Application}
rules:
  - "Correlate the date of the first stability incident with updates installed in the previous 7 days (possible regression; this is a hypothesis)."
  - "Group app_crash by application name and module; report only those repeated 3 or more times."
  - "Application crashes alone are NOT evidence of a hardware failure."
no_findings: "No repeated application failures."
